<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script></head>
<body>
<script type="module">
// The renderer serves the episode folder at /ep/ and the toolkit (engine, node_modules) at /.
import * as L from '/engine/lib.js';
try {
  const tl = await (await fetch('/ep/timeline.json')).json();
  const env = await (await fetch('/ep/env.json')).json();
  const S = await import('/ep/scene.js');
  const app = L.createApp(...(S.RES || []));
  const sc = await S.setup(L, app, tl, env);
  window.renderFrame = (t, q = 0.93) => { sc.frame(t); return app.big.toDataURL('image/jpeg', q); };
  window.__duration = sc.duration;
  window.__ready = true;
} catch (e) { window.__error = String(e.stack || e); }
</script></body></html>
